name: EduTrack CI/CD Pipeline

on:
  push:
    branches:
      - main
      - master
  pull_request:
    branches:
      - main
      - master

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout EduTrack Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install Frontend Dependencies
        working-directory: client
        run: npm install

      - name: Build React App
        working-directory: client
        run: npm run build

      - name: Pipeline Completed
        run: echo "EduTrack CI pipeline completed successfully!"